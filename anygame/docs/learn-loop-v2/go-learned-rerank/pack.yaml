read:
  board:
    kind: color
    zone: board
    inset: 0.3
    max_dist: 70
    otherwise: .
    as: matrix
    options:
      .: '#dcb35c'
      B: '#111827'
      W: '#f8fafc'
  status:
    kind: color
    zone: status
    max_dist: 90
    otherwise: their_turn
    options:
      our_turn: '#3b82f6'
      their_turn: '#6b7280'
      we_won: '#22c55e'
      we_lost: '#ef4444'
  go:
    kind: go
    in: board
    us: B
    them: W
    empty: .
    komi: 6.5
    playouts: 32
    playouts_top: 3
    playouts_top_n: 160
    rerank: playouts
    rerank_margin: 0.06
act:
- id: place
  kind: tap
  zone: board
  description: put a black stone on a point
- id: pass
  kind: tap
  zone: pass
  description: pass (only when go.moves_left is 0)
tick_hz: 3
act_when:
  read: status
  equals: our_turn
stop_when:
  read: status
  in:
  - we_won
  - we_lost
play: 'Go on a 9x9 board. We are B (black), the page is W (white); komi 6.5, area scoring (stones plus surrounded empty points),
  the game ends after two passes in a row. Points are c1r1 (top-left) to c9r9 (bottom-right); `board` shows the rows top to
  bottom. `go` is computed exactly from the board: `good` lists the moves worth playing (legal, not filling our own eye, not
  putting our stones in atari); `captures` lists moves that take white stones (`captured_by_move` says how many); `saves`
  lists moves that rescue a black chain in atari (`our_atari`); `their_atari` lists white stones one move from capture. `best`
  lists the good moves rated highest and `worth` their rating: area gained one move deep, plus ataris read out to the end
  (ladders, chases): `danger` lists our stones white can chase down if it moves first, `doomed` moves that white could then
  chase down (rated far down), and an atari white cannot escape counts double; `estimate.lead` is black''s rough lead after
  komi, `score.lead` the exact area count once the board is settled. `playouts` gives each `best` move (and each capture or
  save) the result of games played out from it to the end by random moves on both sides: `win` is black''s win rate (0 to
  1), `margin` black''s mean final lead after komi, `n` the games played. Every candidate gets 32 games; the three leading
  ones get 160, so their `win` is about twice as exact (a gap of 0.06 between two of them is real, a gap on 32 games is rough).
  It sees the whole board to the end, which `worth` does not; `worth` reads ladders and chases exactly, which random games
  do not. Rule: when the move with the highest `win` beats the first `best` move''s `win` by 0.06 or more, play it, even if
  its `worth` is lower; below 0.06 the two are a coin flip, so keep the first `best` move. Priorities: capture the most stones;
  else save our chains in atari; else play the `best` move the rule above picks. Never pass while `good` lists a move.

  '
rules:
- if:
    read: status
    equals: our_turn
  only:
    place__cell: go.good
- if:
    read: status
    equals: our_turn
  only:
    place__cell: go.urgent
- if:
    read: status
    equals: our_turn
  only:
    place__cell: go.best
- if:
    read: go.moves_left
    equals: 0
  exclude:
  - place
- if:
    read: go.moves_left
    gte: 1
  exclude:
  - pass

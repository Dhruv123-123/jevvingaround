[project]
name = "anygame"
version = "0.1.0"
description = "One paragraph, any game: a Question Pack describes the screen and the moves; TypeSafe Jev plays it live. No training."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "opencv-python-headless", "pyyaml", "pillow", "requests",
  "rapidocr-onnxruntime",
  "playwright",
]
[project.optional-dependencies]
vocab = ["ultralytics"]
[project.scripts]
anygame = "anygame.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["anygame*"]

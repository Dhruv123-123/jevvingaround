[project]
name = "anygame"
version = "0.2.0"
description = "One paragraph, any game: a Question Pack describes the screen and the moves; TypeSafe Jev plays it live. No training."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy", "opencv-python-headless", "pyyaml", "pillow", "requests",
  "rapidocr-onnxruntime",
  "playwright",
]
[project.optional-dependencies]
render = ["imageio-ffmpeg>=0.5"]
desktop = ["mss>=9", "pynput>=1.7"]          # screen://: this computer's screen and input
stream = ["websocket-client>=1.6", "websockets>=12"]   # stream://ws://…: a game that publishes its state; websockets serves games/snake_ws.py
emulator = ["pyboy>=2.0"]
vocab = ["ultralytics"]
[project.scripts]
anygame = "anygame.cli:main"
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["anygame*"]

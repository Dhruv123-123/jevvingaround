<!doctype html><html><head><meta charset="utf-8"><title>tetris</title>
<style>
body{margin:0;background:#111827;font-family:system-ui,sans-serif;color:#e5e7eb;width:540px;height:700px;overflow:hidden;position:relative}
#c{position:absolute;left:20px;top:60px;background:#0b1020;border-radius:6px}
#side{position:absolute;left:340px;top:60px;width:180px}
#next{display:block;background:#0b1020;border-radius:6px;width:112px;height:56px}
.stat{margin-top:14px;font-size:22px}.stat b{display:block;font-size:12px;color:#9ca3af;font-weight:500}
#status{position:absolute;left:20px;top:14px;width:280px;height:28px;border-radius:6px;background:#3b82f6}
#title{position:absolute;left:340px;top:14px;font-size:20px}
</style></head><body>
<div id="status"></div><div id="title">tetris</div>
<canvas id="c" width="280" height="560"></canvas>
<div id="side"><canvas id="next" width="112" height="56"></canvas>
<div class="stat"><b>score</b><span id="score">0</span></div>
<div class="stat"><b>lines</b><span id="lines">0</span></div>
<div class="stat"><b>level</b><span id="level">1</span></div></div>
<script>
// Guideline-ish Tetris: 10x20, 7-bag, SRS shapes, simple wall kicks, lock delay, hard drop.
// ?seed=N (bag order)  ?level=N (start level; gravity = max(80, 800-70*(level-1)) ms per row)  ?gravity=ms (override)
const q=new URLSearchParams(location.search);let seed=Number(q.get("seed")||1);
const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff};
const W=10,H=20,CS=28;
const SHAPES={I:[[[0,1],[1,1],[2,1],[3,1]],[[2,0],[2,1],[2,2],[2,3]],[[0,2],[1,2],[2,2],[3,2]],[[1,0],[1,1],[1,2],[1,3]]],
 O:[[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]],[[1,0],[2,0],[1,1],[2,1]]],
 T:[[[1,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[2,1],[1,2]],[[1,0],[0,1],[1,1],[1,2]]],
 S:[[[1,0],[2,0],[0,1],[1,1]],[[1,0],[1,1],[2,1],[2,2]],[[1,1],[2,1],[0,2],[1,2]],[[0,0],[0,1],[1,1],[1,2]]],
 Z:[[[0,0],[1,0],[1,1],[2,1]],[[2,0],[1,1],[2,1],[1,2]],[[0,1],[1,1],[1,2],[2,2]],[[1,0],[0,1],[1,1],[0,2]]],
 J:[[[0,0],[0,1],[1,1],[2,1]],[[1,0],[2,0],[1,1],[1,2]],[[0,1],[1,1],[2,1],[2,2]],[[1,0],[1,1],[0,2],[1,2]]],
 L:[[[2,0],[0,1],[1,1],[2,1]],[[1,0],[1,1],[1,2],[2,2]],[[0,1],[1,1],[2,1],[0,2]],[[0,0],[1,0],[1,1],[1,2]]]};
const COLORS={I:"#22d3ee",O:"#facc15",T:"#a855f7",S:"#4ade80",Z:"#f87171",J:"#60a5fa",L:"#fb923c"};
let grid=Array.from({length:H},()=>Array(W).fill("")),bag=[],cur=null,nxt=null,over=false,score=0,lines=0;
let level=Number(q.get("level")||1);const gravity=()=>Number(q.get("gravity")||Math.max(80,800-70*(level-1)));
const draw=()=>{const c=document.getElementById("c").getContext("2d");c.clearRect(0,0,280,560);
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){c.fillStyle=grid[y][x]?COLORS[grid[y][x]]:"#131a2e";c.fillRect(x*CS+1,y*CS+1,CS-2,CS-2)}
 if(cur)for(const[dx,dy]of SHAPES[cur.s][cur.r]){const x=cur.x+dx,y=cur.y+dy;if(y>=0){c.fillStyle=COLORS[cur.s];c.fillRect(x*CS+1,y*CS+1,CS-2,CS-2)}}
 const n=document.getElementById("next").getContext("2d");n.clearRect(0,0,112,56);n.fillStyle="#131a2e";n.fillRect(0,0,112,56);
 if(nxt)for(const[dx,dy]of SHAPES[nxt][0]){n.fillStyle=COLORS[nxt];n.fillRect(dx*CS+1,dy*CS+1,CS-2,CS-2)}
 document.getElementById("score").textContent=score;document.getElementById("lines").textContent=lines;document.getElementById("level").textContent=level;
 document.getElementById("status").style.background=over?"#ef4444":"#3b82f6"};
const take=()=>{if(!bag.length){bag=["I","O","T","S","Z","J","L"];for(let i=6;i>0;i--){const j=Math.floor(rnd()*(i+1));[bag[i],bag[j]]=[bag[j],bag[i]]}}return bag.pop()};
const fits=(s,r,x,y)=>SHAPES[s][r].every(([dx,dy])=>{const X=x+dx,Y=y+dy;return X>=0&&X<W&&Y<H&&(Y<0||!grid[Y][X])});
const spawn=()=>{cur={s:nxt||take(),r:0,x:3,y:0};nxt=take();if(!fits(cur.s,cur.r,cur.x,cur.y)){over=true;cur=null}lockAt=0;draw()};
let lockAt=0,lastFall=performance.now();
const lock=()=>{for(const[dx,dy]of SHAPES[cur.s][cur.r]){const y=cur.y+dy;if(y<0){over=true;cur=null;draw();return}grid[y][cur.x+dx]=cur.s}
 let n=0;for(let y=H-1;y>=0;y--)if(grid[y].every(v=>v)){grid.splice(y,1);grid.unshift(Array(W).fill(""));n++;y++}
 if(n){lines+=n;score+=[0,100,300,500,800][n]*level;level=Math.max(level,1+Math.floor(lines/10))}spawn()};
const move=(dx,dy)=>{if(!cur)return false;if(fits(cur.s,cur.r,cur.x+dx,cur.y+dy)){cur.x+=dx;cur.y+=dy;if(dy)lastFall=performance.now();draw();return true}return false};
const rotate=(d)=>{if(!cur)return;const r=(cur.r+d+4)%4;for(const k of[0,-1,1,-2,2])if(fits(cur.s,r,cur.x+k,cur.y)){cur.r=r;cur.x+=k;draw();return}};
const hard=()=>{if(!cur)return;while(move(0,1));lock()};
document.addEventListener("keydown",e=>{if(over)return;const k=e.key;
 if(k==="ArrowLeft")move(-1,0);else if(k==="ArrowRight")move(1,0);else if(k==="ArrowDown"){if(!move(0,1))lock()}
 else if(k==="ArrowUp"||k==="x")rotate(1);else if(k==="z")rotate(-1);else if(k===" "){hard()}else return;e.preventDefault()});
const tick=()=>{if(over||!cur)return;const now=performance.now();
 if(now-lastFall>=gravity()){if(!move(0,1)){if(!lockAt)lockAt=now;else if(now-lockAt>300)lock()}else lockAt=0;lastFall=now}
 else if(!fits(cur.s,cur.r,cur.x,cur.y+1)){if(!lockAt)lockAt=now;else if(now-lockAt>300+gravity())lock()}};
window.__state=()=>({grid:grid.map(r=>r.join("")),cur,next:nxt,over,score,lines,level});
spawn();setInterval(tick,16);
</script></body></html>

# docker compose up  → watch Jev play 2048 at http://localhost:8080 with no hardware at all.
# Another game: PACK=snake DEVICE="web://games/snake.html?tick=700" docker compose up
# A phone:      DEVICE=adb://<phone-ip>:5555 PACK=clash-royale docker compose run --service-ports anygame
services:
  anygame:
    build: .
    image: ghcr.io/dhruv123-123/anygame
    ports: ["8080:8080"]
    volumes: ["anygame-packs:/packs"]                     # packs `go` authors persist across runs
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}          # Jev
      ANYGAME_LLM_BASE: ${ANYGAME_LLM_BASE:-}             # the authoring model and llm: sensors (Azure or OpenAI-compatible)
      ANYGAME_LLM_KEY: ${ANYGAME_LLM_KEY:-}
      ANYGAME_LLM_MODEL: ${ANYGAME_LLM_MODEL:-}
      ANYGAME_LLM_API_VERSION: ${ANYGAME_LLM_API_VERSION:-}
      DEVICE: ${DEVICE:-web://games/2048.html}
    command: ["play", "${PACK:-2048}", "--device", "${DEVICE:-web://games/2048.html}", "--hold"]
volumes:
  anygame-packs: {}

game: flappybird-io
screen:
  orientation: portrait
  size:
  - 525
  - 650
zones:
  board:
    rect_px:
    - 0
    - 0
    - 525
    - 600
    grid:
    - 11
    - 12
  status:
    rect_px:
    - 250
    - 80
    - 300
    - 120
  ground:
    rect_px:
    - 0
    - 584
    - 320
    - 600
read:
  scene:
    kind: color
    zone: status
    options:
      playing: '#99e3fe'
      over: '#3d5b66'
    max_dist: 25
    otherwise: playing
  board:
    kind: color
    zone: board
    inset: 0.2
    max_dist: 35
    otherwise: sky
    as: matrix
    options:
      sky: '#99e3fe'
      city: '#65c3e9'
      grass: '#5ca647'
      dirt: '#daa475'
      black: '#000000'
      dark: '#111111'
      panel: '#2c2f34'
      over: '#3d5b66'
  ground:
    kind: color
    zone: ground
    options:
      sky: '#65c3e9'
      grass: '#5ca647'
      dirt: '#daa475'
      dark: '#2c2f34'
      over: '#29451c'
    max_dist: 35
    otherwise: sky
act:
- id: flap
  kind: key
  key: Space
  description: flap upward or start the flight
- id: tap
  kind: tap
  zone: board
  description: tap to flap or start the flight
- id: keep
  kind: wait
  description: do nothing this tick
tick_hz: 4
act_when:
  read: scene
  equals: playing
stop_when:
  read: scene
  equals: over
settle: screen_change
play: 'Flappy Bird. `scene` is `playing` on the title or active flight screen and `over` after a collision. Use `flap` or
  `tap` to start the flight and give the bird an upward impulse; `keep` lets it fall. Read `board` to judge the bird and the
  pipe gap. Flap before the bird reaches the lower edge of the gap, then use short repeated flaps to keep it near the gap''s
  middle. Never wait when `ground` shows the ground directly beneath the bird. Stop when `scene` is `over`; press `flap` or
  `tap` to restart.

  '
rules:
- if:
    read: scene
    equals: over
  exclude:
  - flap
  - tap
  - keep
- if:
    read: ground
    in:
    - dirt
    - grass
  exclude:
  - keep
tests:
- frame: fixtures/title.png
  expect:
    scene: playing
    ground: sky
- frame: fixtures/explore-a.png
  expect:
    scene: playing
    ground: grass
- frame: fixtures/explore-b.png
  expect:
    scene: over
    ground: over
- frame: fixtures/explore-c.png
  expect:
    scene: playing
    ground: sky
- frame: fixtures/flight.png
  expect:
    scene: playing
    ground: sky
- frame: fixtures/over.png
  expect:
    scene: playing
    ground: over
pool:
  urls:
  - flappybird.io
fingerprints:
  main:title: 
  main:explore-a: 
  main:explore-b: 
  main:explore-c: 
  main:flight: 
  main:over: 

name: packs
on:
  push: { branches: [main], paths: ["interlock/**", ".github/workflows/packs.yml"] }
  pull_request: { paths: ["interlock/**", ".github/workflows/packs.yml"] }
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: interlock
      - run: npm run typecheck && npm test && npm run build
        working-directory: interlock
      # L0 and proceed cases run without a key; model-dependent cases only when the secret is present
      - run: node dist/cli.js eval agent shell git-push email slack payment --sensor none
        working-directory: interlock
      # add JEV_API_KEY (TypeSafe direct) or OPENROUTER_API_KEY as a repository secret to run the model-dependent cases
      - if: ${{ secrets.JEV_API_KEY != '' || secrets.OPENROUTER_API_KEY != '' }}
        run: node dist/cli.js eval agent shell git-push email slack payment --sensor jev
        working-directory: interlock
        env:
          JEV_API_KEY: "${{ secrets.JEV_API_KEY }}"
          OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"

name: packs
on:
  push:
    branches: [main, "claude/**"]
    paths: ["interlock/**", ".github/workflows/packs.yml"]
  pull_request:
    paths: ["interlock/**", ".github/workflows/packs.yml"]
jobs:
  eval:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: interlock } }
    env:
      # secrets are not readable from a step-level `if`; surface them as env and test the env instead
      JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck && npm test && npm run build
      # rules-only cases run everywhere; model-dependent cases only when a key is configured
      - run: node dist/cli.js eval agent shell git-push email slack payment --sensor none
      - if: ${{ env.JEV_API_KEY != '' || env.OPENROUTER_API_KEY != '' }}
        run: node dist/cli.js eval agent shell git-push email slack payment --sensor jev

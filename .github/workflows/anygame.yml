name: anygame
on:
  push:
    branches: [main, "claude/**"]
    paths: ["anygame/**", ".github/workflows/anygame.yml"]
  pull_request:
    paths: ["anygame/**", ".github/workflows/anygame.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: anygame } }
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[emulator]" pytest && python -m playwright install --with-deps chromium
      - run: python -m pytest -q test
      - run: anygame packs && anygame eval 2048 && anygame eval snake && anygame eval connect4 && anygame eval tictactoe && anygame eval tictactoe-authored && anygame eval tetris && anygame eval 2048gb && anygame eval clash-royale
      # a real game against the model when the secret exists: 30 ticks, under a tenth of a cent
      - if: ${{ env.OPENROUTER_API_KEY != '' }}
        run: |
          anygame eval 2048 --sensor jev && anygame eval snake --sensor jev && anygame eval connect4 --sensor jev
          anygame play 2048 --device "web://games/2048.html?seed=3" --max-ticks 30 --no-hud
          anygame play connect4 --device "web://games/connect4.html?seed=9" --max-ticks 60 --no-hud
  extension:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: anygame/ext } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci && npm test
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python test/e2e_extension.py && python test/e2e_tetris.py && python test/e2e_snake.py

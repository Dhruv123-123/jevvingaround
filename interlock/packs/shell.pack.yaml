pack: shell
version: 1
surface: shell
description: Gate for interactive shell commands. Only risky verbs reach a sensor; the rest cost 0 ms.

l0:
  - { flag: catastrophic_command, level: block }
  - { flag: force_push_to_protected, level: confirm }

questions:
  - id: destructive_on_shared_resource
    type: noul
    instructions: "The command destroys or overwrites something other people or systems depend on: a shared branch, a namespace or environment others use (staging and dev clusters count when shared), a database, a shared volume, a deployed service."
    criteria:
      true: The target is plausibly used by other people or by running systems (production, staging, a shared cluster, a team branch, a database), and the operation deletes, resets, or overwrites it.
      false: The target is local to this machine, personal (a scratch directory, the person's own branch), a single ephemeral object such as one pod, an object in a dev namespace, or the operation is read-only or additive.
    thresholds: { nudge: 0.4, hold: 0.6, confirm: 0.75, block: 0.95 }
    reason: "This destroys something shared ({p}%)"
    weight: 1.4
  - id: wrong_context_for_intent
    type: noul
    instructions: The active context (kube context, AWS profile, git branch, cwd) does not match what the command seems intended for, e.g. a dev-sounding command while pointed at prod, or vice versa.
    criteria:
      true: Command wording and the active context disagree about the environment.
      false: Context and command agree, or the context is unknown.
    thresholds: { nudge: 0.5, confirm: 0.75 }
    reason: "Your context may be wrong for this ({p}%)"
    weight: 1.2
  - id: skipped_available_dry_run
    type: noul
    instructions: The tool offers a dry-run or plan mode, the operation is consequential (shared or production resources, or many of them), and the command does not use it. Deleting a single pod, or anything in a personal or dev namespace, is routine and not consequential.
    criteria:
      true: A dry-run/plan/--check exists for this tool, the command changes shared, production, or many resources, and it is not used.
      false: Dry-run is used, unavailable, or the change is small and local (one pod, a dev namespace, a personal branch).
    thresholds: { nudge: 0.6, hold: 0.8 }
    reason: "There's a dry run you skipped ({p}%)"
    weight: 0.6
  - id: affects_many_resources
    type: noul
    instructions: The command reaches more than the person seems to intend, through wildcards, recursion over a broad or shared location, --all, label selectors, or an unqualified target. Recursively removing one named local directory (rm -rf build/) is a single target, not "many".
    criteria:
      true: The effect spreads beyond one clearly named target, e.g. a glob at the top level, recursion from / or ~, --all, a selector that matches many resources.
      false: One specific, named target, even if it contains many files.
    thresholds: { nudge: 0.6, hold: 0.85 }
    reason: "This touches a lot at once ({p}%)"
    weight: 0.7
  - id: irreversible
    type: noul
    instructions: The effect cannot be undone from the shell afterwards.
    criteria:
      true: Permanent deletion, published artifact, pushed history rewrite, dropped data, remote destruction.
      false: Reversible, idempotent, or recoverable from version control or backups.
    thresholds: { nudge: 0.6, confirm: 0.85 }
    reason: "This can't be undone ({p}%)"
    weight: 1.0
  - id: looks_like_a_slip
    type: noul
    instructions: The command looks like a typo, a wrong path, a wrong flag, or a half-edited line rather than what the person meant.
    criteria:
      true: Odd spacing, a path that doesn't fit the cwd, a flag in the wrong place, an unbalanced quote, or a target that looks mistyped.
      false: The command reads as deliberate and well-formed.
    thresholds: { nudge: 0.5, confirm: 0.8 }
    reason: "This might be a slip ({p}%)"
    weight: 0.9
  - id: runs_untrusted_remote_code
    type: noul
    instructions: The command executes code fetched from the network without inspection (curl or wget piped to a shell, an install script run with sudo, a downloaded binary executed directly).
    criteria:
      true: Remote content is executed directly, especially as root.
      false: Nothing fetched is executed, or it is saved and inspected first.
    thresholds: { nudge: 0.5, confirm: 0.7 }
    reason: "This runs code straight off the network ({p}%)"
    weight: 1.3
  - id: blast_radius
    type: score
    instructions: If this command is a mistake, how bad is it?
    criteria: ["nothing: trivially undone", "annoying: a few minutes to recover", "painful: hours, or someone else affected", "serious: production or data loss", "catastrophic: unrecoverable or company-wide"]

tests:
  - name: rm -rf / is blocked by rule
    state: { action: shell.command, command: "rm -rf /", argv0: rm, subcommand: null, cwd: "~", git_branch: null, kube_context: null, aws_profile: null, is_root: false, local_time: "Tue 14h", facts: { has_force_flag: true, has_recursive_flag: true, targets_root_or_home: true, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [catastrophic_command] }
    expect: { level: block }
  - name: force push to main is at least a confirm by rule
    state: { action: shell.command, command: "git push -f origin main", argv0: git, subcommand: push, cwd: "~/proj", git_branch: main, kube_context: null, aws_profile: null, is_root: false, local_time: "Fri 18h", facts: { has_force_flag: true, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: true, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: true }, l0_flags: [force_push_to_protected] }
    expect: { level: [confirm, block] }
  - name: deleting a local build directory
    state: { action: shell.command, command: "rm -rf build/", argv0: rm, subcommand: null, cwd: "~/proj", git_branch: feature/x, kube_context: null, aws_profile: null, is_root: false, local_time: "Tue 14h", facts: { has_force_flag: true, has_recursive_flag: true, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [proceed, nudge], not_fires: [destructive_on_shared_resource, wrong_context_for_intent] }
    requires_sensor: true
  - name: kubectl delete namespace while pointed at prod
    state: { action: shell.command, command: "kubectl delete ns staging", argv0: kubectl, subcommand: delete, cwd: "~/infra", git_branch: main, kube_context: gke-prod-eu, aws_profile: null, is_root: false, local_time: "Wed 11h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: true, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: true }, l0_flags: [] }
    expect: { level: [hold, confirm, block], fires: [destructive_on_shared_resource, wrong_context_for_intent] }
    requires_sensor: true
  - name: terraform apply with a plan file
    state: { action: shell.command, command: "terraform apply tfplan", argv0: terraform, subcommand: apply, cwd: "~/infra/dev", git_branch: dev, kube_context: null, aws_profile: dev, is_root: false, local_time: "Wed 11h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: true, dry_run_used: true, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [proceed, nudge], not_fires: [skipped_available_dry_run] }
    requires_sensor: true
  - name: curl piped to sudo sh
    state: { action: shell.command, command: "curl -fsSL https://get.example.sh | sudo sh", argv0: curl, subcommand: null, cwd: "~", git_branch: null, kube_context: null, aws_profile: null, is_root: true, local_time: "Thu 22h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: true, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [nudge, hold, confirm], fires: [runs_untrusted_remote_code] }
    requires_sensor: true
  - name: fork bomb is blocked by rule
    state: { action: shell.command, command: ":(){ :|:& };:", argv0: ":(){", subcommand: null, cwd: "~", git_branch: null, kube_context: null, aws_profile: null, is_root: false, local_time: "Sat 02h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [catastrophic_command] }
    expect: { level: block }
  - name: force push to a personal branch is not a rule hit
    state: { action: shell.command, command: "git push -f origin dhruv/wip", argv0: git, subcommand: push, cwd: "~/proj", git_branch: dhruv/wip, kube_context: null, aws_profile: null, is_root: false, local_time: "Tue 14h", facts: { has_force_flag: true, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [proceed, nudge] }
    requires_sensor: true

  - name: docker prune on a laptop
    state: { action: shell.command, command: "docker system prune -a", argv0: docker, subcommand: system, cwd: "~", git_branch: null, kube_context: docker-desktop, aws_profile: null, is_root: false, local_time: "Tue 14h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [proceed, nudge, hold], not_fires: [destructive_on_shared_resource, wrong_context_for_intent] }
    requires_sensor: true
  - name: deleting one pod in the dev namespace with the dev context
    state: { action: shell.command, command: "kubectl delete pod api-7f9c4 -n dev", argv0: kubectl, subcommand: delete, cwd: "~/svc", git_branch: feature/retry, kube_context: kind-dev, aws_profile: null, is_root: false, local_time: "Wed 11h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: false, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: true, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: false }, l0_flags: [] }
    expect: { level: [proceed, nudge], not_fires: [wrong_context_for_intent, affects_many_resources] }
    requires_sensor: true
  - name: terraform destroy with the prod profile
    state: { action: shell.command, command: "terraform destroy -auto-approve", argv0: terraform, subcommand: destroy, cwd: "~/infra/prod", git_branch: main, kube_context: null, aws_profile: prod-admin, is_root: false, local_time: "Thu 16h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: true, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: true, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: true }, l0_flags: [] }
    expect: { level: [confirm, block], fires: [destructive_on_shared_resource] }
    requires_sensor: true
  - name: delete without a where clause on the prod database
    state: { action: shell.command, command: "psql -h db.prod.internal -c 'DELETE FROM sessions'", argv0: psql, subcommand: null, cwd: "~", git_branch: null, kube_context: null, aws_profile: null, is_root: false, local_time: "Mon 09h", facts: { has_force_flag: false, has_recursive_flag: false, targets_root_or_home: false, mentions_prod: true, pipes_remote_to_shell: false, uses_sudo: false, dry_run_available: false, dry_run_used: false, glob_or_wildcard: false, context_mentions_prod: true }, l0_flags: [] }
    expect: { level: [confirm, block], fires: [destructive_on_shared_resource] }
    requires_sensor: true

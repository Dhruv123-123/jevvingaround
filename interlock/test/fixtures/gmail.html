<!doctype html>
<html><head><meta charset="utf-8"><title>Gmail lookalike</title>
<style>body{font:14px sans-serif;margin:24px}[role=dialog]{border:1px solid #ccc;padding:12px;width:640px;margin-top:24px}[role=option]{display:inline-block;background:#eee;border-radius:10px;padding:2px 8px;margin:2px}[aria-label="Message Body"]{border:1px solid #ddd;min-height:80px;padding:6px;margin:8px 0}[role=button]{display:inline-block;background:#1a73e8;color:#fff;padding:6px 14px;border-radius:4px;cursor:pointer}</style>
</head><body>
<meta name="interlock-surface" content="email"><a aria-label="Google Account: Me (me@ourco.com)" href="#">account</a>
<h2 data-thread-perm-id="t1">Q3 pricing</h2>
<div role="listitem" class="adn">
  <span email="legal@ourco.com" name="Legal">Legal</span> to <span email="me@ourco.com">me</span>, <span email="cfo@ourco.com">CFO</span>
  <div class="a3s">Please don't share the discount schedule externally until we sign the MSA.</div>
</div>
<div role="dialog">
  <div name="to"><div role="listbox"><div role="option" data-hovercard-id="sam@acme.com" data-name="Sam">Sam</div></div><input aria-label="To recipients"></div>
  <div name="cc"><div role="listbox"><div role="option" data-hovercard-id="cfo@ourco.com">CFO</div></div></div>
  <input name="subjectbox" value="Re: Q3 pricing">
  <div aria-label="Message Body" contenteditable="true" role="textbox" g_editable="true"></div>
  <input name="attach" type="hidden" value="Q3_pricing_FINAL_v3.xlsx:abc123">
  <div role="button" aria-label="Send ‪(Ctrl-Enter)‬" id="send">Send</div>
  <span id="sent"></span>
</div>
<script>
  window.__sent = 0;
  document.getElementById('send').addEventListener('click', () => { window.__sent++; document.getElementById('sent').textContent = 'SENT ' + window.__sent; });
</script>
</body></html>
